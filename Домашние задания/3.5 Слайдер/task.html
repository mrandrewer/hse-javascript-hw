<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Слайдер</title>
    <link rel="stylesheet" href="task.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>
    <header class="header">
        <div class="logo__container">
            <a href="https://netology.ru/" class="logo__link"></a>
        </div>
    </header>
    <div class="slider">
        <div class="slider__items">
            <div class="slider__item slider__item_active">
                <img src="images/1.jpg" class="slider__image" alt="">
            </div>
            <div class="slider__item">
                <img src="images/2.jpg" class="slider__image" alt="">
            </div>
            <div class="slider__item">
                <img src="images/3.jpg" class="slider__image" alt="">
            </div>
            <div class="slider__item">
                <img src="images/4.jpg" class="slider__image" alt="">
            </div>
            <div class="slider__item">
                <img src="images/5.jpg" class="slider__image" alt="">
            </div>
        </div>
        <div class="slider__navigation">
            <div class="slider__arrows">
                <div class="slider__arrow slider__arrow_prev">&lt;</div>
                <div class="slider__arrow slider__arrow_next">&gt;</div>
            </div>
            <div class="slider__dots">
                <div class="slider__dot"></div>
                <div class="slider__dot"></div>
                <div class="slider__dot"></div>
                <div class="slider__dot"></div>
                <div class="slider__dot"></div>
            </div>
        </div>
    </div>
    <script src="task.js"></script>
</body>

</html>
